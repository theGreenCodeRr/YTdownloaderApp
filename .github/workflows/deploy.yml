name: Deploy to Self-Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # This must match the label you gave the runner during setup
    runs-on: repo-ytdown 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Configuration to /opt/
        run: |
          # Rsync copies the files from the runner workspace to your permanent config folder
          # Server-only files (.env, secrets/, data/) are excluded so they are never touched
          rsync -avz --exclude '.git' --exclude '.env' --exclude 'secrets/' --exclude 'data/' --exclude 'cookies.txt' ./ /opt/deployments/ytdown/

      - name: Deploy with Docker Compose
        run: |
          cd /opt/deployments/ytdown
          
          # Bring down existing containers
          docker compose down
          
          # Rebuild and start in detached mode
          docker compose up --build -d
          
          # Prune old images to save disk space
          docker image prune -f